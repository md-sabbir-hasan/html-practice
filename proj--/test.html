<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
      body {
        margin: 0;
        height: 100vh;
        background: #0a0f1c;
      }
      #particles-js {
        position: absolute;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="particles-js"></div>

    <script>
      particlesJS("particles-js", {
        particles: {
          number: { value: 80 },
          color: { value: "#7bed9f" },
          size: { value: 4 },
          opacity: { value: 0.8 },
          line_linked: {
            enable: true,
            color: "#7bed9f",
            distance: 200,
          },
          move: {
            speed: 10,
          },
        },
        interactivity: {
          events: {
            onhover: { enable: true, mode: "repulse" },
          },
        },
      });
    </script>
  </body>
</html>
